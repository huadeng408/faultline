<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="faultline-arch-title faultline-arch-desc" id="faultline-hybrid-architecture-root">
        <title id="faultline-arch-title">FaultLine v3 Hybrid AI and Buckingham-Pi Architecture</title>
        <desc id="faultline-arch-desc">Secure paved road architecture showing on-device Gemini Nano 4 intake, Buckingham-Pi dimensionless normalization blocking raw PII egress, cloud 2,000-trial Monte Carlo execution, and 60fps local Pareto minimal-fix solving.</desc>
