        <text x="174" y="77" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CHROME EDGE · ON-DEVICE ZONE</text>

        <!-- Zone 2: Buckingham-Pi Privacy Gate -->
        <rect x="592" y="64" width="248" height="536" rx="8" fill="#2d3142" stroke="#bf4520" stroke-width="0.8" stroke-dasharray="4,4" fill-opacity="0.02" stroke-opacity="0.30"/>
